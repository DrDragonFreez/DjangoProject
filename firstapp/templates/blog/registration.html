{% extends 'blog/base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="text-center mb-4">Регистрация</h2>

        <form action="{% url 'register' %}" method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username"
                   class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                   value="{{ form.username.value|default_if_none:'' }}">
            <div class="invalid-feedback">{{ form.username.errors.0 }}</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email"
                   class="form-control {% if form.email.errors %}is-invalid{% endif %}"
                   value="{{ form.email.value|default_if_none:'' }}">
            <div class="invalid-feedback">{{ form.email.errors.0 }}</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password"
                   class="form-control {% if form.password.errors %}is-invalid{% endif %}">
            <div class="invalid-feedback">{{ form.password.errors.0 }}</div>
          </div>

          <div class="mb-3">
            <label class="form-label">Повторите пароль</label>
            <input type="password" name="password_confirm"
                   class="form-control {% if form.password_confirm.errors %}is-invalid{% endif %}">
            <div class="invalid-feedback">{{ form.password_confirm.errors.0 }}</div>
          </div>

          <button type="submit" class="btn btn-dark w-100 rounded-pill">Зарегистрироваться</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
